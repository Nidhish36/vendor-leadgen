services:
  db:
    image: postgres:16
    container_name: vendor_leadgen_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadgen_user
      POSTGRES_PASSWORD: leadgen_pass
      POSTGRES_DB: vendor_leadgen
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: vendor_leadgen_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata: